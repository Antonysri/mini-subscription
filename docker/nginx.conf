# ==============================================================================
# Nginx Configuration: Unified Traffic Splitter for Laravel API + React SPA
# 
# ❓ INTHA CONFIGURATION ENNA PANNUTHU?
# Port 80-la vara requests-ah rendu category-ah pirikkum:
# 1. /api/* ➔ Laravel PHP-FPM Engine kitta anupum (Database queries & Auth)
# 2. Everything else (/*) ➔ React Vite SPA files-ah browser-ku send pannum
# ==============================================================================

server {
    # 1. Nginx container kulla Port 80-la listen pannum:
    listen 80;
    server_name localhost;

    # 2. Root directory: Laravel-oda public directory (Inga thaan React dist files-um irukum):
    root /var/www/html/public;
    index index.html index.php;

    # 3. Charset & Max upload size:
    charset utf-8;
    client_max_body_size 20M;

    # 4. Gzip Compression (Network bandwidth-ah 70% save panna):
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --------------------------------------------------------------------------
    # ROUTE RULE 1: LARAVEL BACKEND API (/api/*)
    # --------------------------------------------------------------------------
    # URL-la '/api/' nu vantha, athai Laravel-oda index.php-ku route panrom:
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # ROUTE RULE 2: PHP-FPM HANDLER (PHP scripts execution)
    # --------------------------------------------------------------------------
    # index.php call aagum pothu, athai FastCGI moolama PHP 8.3 Engine (Port 9000)-ku anupum:
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # --------------------------------------------------------------------------
    # ROUTE RULE 3: REACT SPA ROUTING (HTML5 History API Fallback)
    # --------------------------------------------------------------------------
    # User /plans or /dashboard-la irunthu page refresh pannina 404 varakoodathu!
    # File disk-la illana fallback-ah index.html-ku anupi React Router-ah activate pannum:
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # ROUTE RULE 4: SECURITY HARDENING (Block sensitive dotfiles)
    # --------------------------------------------------------------------------
    # .env, .git maathiri sensitive files-ah browser-la yaarume direct-ah access panna mudiyathu:
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
