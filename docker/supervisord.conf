; ==============================================================================
; Supervisord Configuration: Dual-Process Manager for Nginx + PHP-FPM
;
; ❓ INTHA FILE ENNA PANNUTHU?
; Container start aagum pothu ore nerathula Nginx webserver matrum 
; PHP-FPM engine rendaiyume start panni, continuous-ah monitor pannum!
; ==============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ------------------------------------------------------------------------------
; PROCESS 1: PHP 8.3 FastCGI Process Manager (PHP-FPM)
; ------------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------------------------------------
; PROCESS 2: Nginx Web Server
; ------------------------------------------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
